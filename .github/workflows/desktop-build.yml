name: Build desktop app

# Runs on every push of a version tag (v1.0.0, v1.2.3, ...) and can also be
# triggered manually from the Actions tab. Each matrix cell builds on a real
# runner for that OS -- PyInstaller bundles for whatever platform it's
# running on, it can't cross-compile.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: stem-access-macos
          - os: windows-latest
            artifact_name: stem-access-windows
          - os: ubuntu-latest
            artifact_name: stem-access-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r ../requirements.txt -r ../requirements-desktop.txt

      - name: Build with PyInstaller
        run: pyinstaller STEM-Access.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: app/dist/*
          if-no-files-found: error

  release:
    # Only attach artifacts to a release when this run was triggered by an
    # actual version tag -- a manual workflow_dispatch run is for testing
    # the build itself, not for publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's build
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$dir"
          done

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
