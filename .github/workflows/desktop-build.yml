name: Build desktop app

# Runs on every push of a version tag (v1.0.0, v1.2.3, ...) and can also be
# triggered manually from the Actions tab. Each matrix cell builds on a real
# runner for that OS -- PyInstaller bundles for whatever platform it's
# running on, it can't cross-compile.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: dist/ has both the raw onedir build and the actual
          # STEM-Access.app bundle built from it -- only the .app is useful
          # to end users (it's the double-clickable one), so upload just
          # that instead of both.
          - os: macos-latest
            artifact_name: stem-access-macos
            build_name: STEM-Access.app
          - os: windows-latest
            artifact_name: stem-access-windows
            build_name: STEM-Access
          - os: ubuntu-latest
            artifact_name: stem-access-linux
            build_name: STEM-Access
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r ../requirements.txt -r ../requirements-desktop.txt

      - name: Build with PyInstaller
        run: pyinstaller STEM-Access.spec --noconfirm

      - name: Stage the build output on its own
        # actions/upload-artifact treats a single explicit directory path
        # differently from a glob: given one literal directory, it uploads
        # that directory's *contents* as the artifact root, silently
        # dropping the directory's own name (STEM-Access.app). A glob over
        # a staging folder containing just that one entry preserves the
        # name instead -- confirmed against the original app/dist/* build,
        # which did keep names since it matched via a glob.
        shell: bash
        run: |
          mkdir -p stage
          cp -R "dist/${{ matrix.build_name }}" stage/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: app/stage/*
          if-no-files-found: error

  release:
    # Only attach artifacts to a release when this run was triggered by an
    # actual version tag -- a manual workflow_dispatch run is for testing
    # the build itself, not for publishing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore executable permissions
        # actions/upload-artifact + actions/download-artifact don't reliably
        # carry the Unix executable bit through their zip-based transport --
        # binaries arrive non-executable even though they were fine right
        # after the build, which surfaces to users as "can't be opened" /
        # "permission denied". Windows .exe doesn't need this.
        run: |
          chmod +x artifacts/stem-access-macos/STEM-Access.app/Contents/MacOS/STEM-Access
          chmod +x artifacts/stem-access-linux/STEM-Access/STEM-Access

      - name: Zip each platform's build
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$dir"
          done

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
